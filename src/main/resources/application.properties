spring.application.name=Habits

# --- Daten ---------------------------------------------------------------------
# Alles liegt unter einem Verzeichnis (auf dem Server /opt/habits/data). Relative
# Pfade gelten ab dem Arbeitsverzeichnis, in dem die App gestartet wird.
habits.data-dir=${HABITS_DATA_DIR:data}
# Die Habits der alten App - nach der Migration nur noch gelesen, nie geschrieben:
# sie bleiben als Sicherung liegen.
habits.data-file=${habits.data-dir}/habits.json
# Die Fokus-Sessions aus dem Wald der Fokus-App - werden weiter geschrieben.
habits.focus-file=${habits.data-dir}/focus.json
# Alles von coHabit: Personen, Co-Habits, Eintraege, Chat, Timeline, Fotos.
cohabit.dir=${habits.data-dir}/cohabit

# --- Netz ------------------------------------------------------------------
# Interner Port, nur localhost; nginx terminiert TLS und reicht durch. Kein
# Context-Path mehr: die Controller tragen den vollen Pfad (/cohabit/..., und
# /habits/api/focus/... fuer den Wald).
server.port=48190
server.address=127.0.0.1
server.forward-headers-strategy=framework

# Fotos bis 10 MB; nginx laesst 12 MB durch. Ohne max-swallow-size bricht Tomcat
# bei einem zu grossen Upload die Verbindung ab, statt 413 zu antworten.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1

# --- Zugang ------------------------------------------------------------------
# Der geteilte Privat-Modus-Token von fherrmann.com: fh_private meint die
# Eigentuemerin (Felix). Steht in /etc/nginx/conf.d/private-mode.conf und kommt
# ueber /etc/habits.env herein. Der Vorgabewert ist nur fuer die lokale Entwicklung.
habits.security.token=${FH_PRIVATE_TOKEN:changeme-local-token}
# Die Healthy-Personen - wortgleich wie in /etc/food.env.
health.owner=${HEALTH_OWNER:felix}
health.tokens=${HEALTH_TOKENS:}
# Wohin Einladungs- und Setup-Links zeigen.
cohabit.public-url=${COHABIT_PUBLIC_URL:https://fherrmann.com/cohabit}

# --- Zeit ----------------------------------------------------------------------
# Die Zone der Fokus-Sessions und die Vorgabe fuer neue Co-Habits. Jedes Co-Habit
# rechnet in seiner eigenen Zone.
habits.zone=Europe/Berlin

# --- Quellen fuer die automatischen Co-Habits ----------------------------------
# "Track food" fragt den Kalorienzaehler, die Schritte den Weight Tracker - beide
# auf derselben Kiste, deshalb ueber localhost. Felix mit fh_private bzw.
# WEIGHT_APP_TOKEN, andere Healthy-Personen per Bearer mit ihrem Token.
habits.food.url=${FOOD_URL:http://127.0.0.1:48180}
habits.weight.url=${WEIGHT_URL:http://127.0.0.1:48173}
habits.weight.token=${WEIGHT_APP_TOKEN:}

# --- Push ----------------------------------------------------------------------
# iOS ueber APNs (token-basiert), Android ueber Firebase. Ohne Schluessel bzw.
# Dienstkonto gibt es keinen Push, sonst laeuft alles.
cohabit.push.key-file=${APNS_KEY_FILE:}
cohabit.push.key-id=${APNS_KEY_ID:}
cohabit.push.team-id=${APNS_TEAM_ID:}
cohabit.push.topic=${APNS_TOPIC:com.fherrmann.cohabit}
cohabit.push.host=${APNS_HOST:https://api.sandbox.push.apple.com}
cohabit.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}

# --- Android-App ---------------------------------------------------------------
# cohabit.apk + latest.json, gefuellt von tools/publish.sh im Repo cohabit-android.
cohabit.android.dir=${COHABIT_ANDROID_DIR:}
cohabit.android.announced-file=${cohabit.dir}/android-release.json

# --- Scheduler -----------------------------------------------------------------
# Erinnerungen, gefaehrdete Serien, Challenge- und Ziel-Enden, Meilensteine.
cohabit.scheduler.enabled=true
