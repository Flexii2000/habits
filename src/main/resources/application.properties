spring.application.name=Habits

# Die eine Datei, in der alles steht: Habits und ihre Haken. Relative Pfade
# gelten ab dem Arbeitsverzeichnis, in dem die App gestartet wird.
habits.data-file=data/habits.json
# Die Fokus-Sessions aus dem Wald der Fokus-App - eigene Datei, eigener
# Rhythmus (jede durchgestandene Session ein Eintrag).
habits.focus-file=data/focus.json

# --- Netz ------------------------------------------------------------------
# Interner Port, nur localhost; nginx terminiert TLS und reicht durch. Der
# Dienst liegt unter fherrmann.com/habits - ein Pfad, keine Subdomain: kein
# DNS-Eintrag, kein eigenes Zertifikat (siehe README).
server.port=48190
server.address=127.0.0.1
server.servlet.context-path=/habits
server.forward-headers-strategy=framework

# --- Zugang ------------------------------------------------------------------
# Der geteilte Privat-Modus-Token von fherrmann.com, wie beim Kalorienzaehler:
# er gehoert nicht dieser App, sondern steht in
# /etc/nginx/conf.d/private-mode.conf und kommt ueber /etc/habits.env herein.
# Der Vorgabewert ist nur fuer die lokale Entwicklung.
habits.security.token=${FH_PRIVATE_TOKEN:changeme-local-token}

# --- Zeit ----------------------------------------------------------------------
# Ein Tag endet um Mitternacht in DIESER Zone, eine Woche beginnt Montag 0:00.
# Ausdruecklich und nicht "wie der Server": wer die App auf einer Kiste in UTC
# startet, bekaeme sonst um 22 Uhr einen neuen Tag.
habits.zone=Europe/Berlin

# --- Quellen fuer die automatischen Habits ------------------------------------
# "Track food" fragt den Kalorienzaehler, die Schritte den Weight Tracker -
# beide laufen auf derselben Kiste, deshalb ueber localhost und nicht ueber
# nginx. Der Kalorienzaehler nimmt denselben Privat-Token; der Weight Tracker
# hat sein eigenes (WEIGHT_APP_TOKEN aus /etc/health-viz.env).
habits.food.url=${FOOD_URL:http://127.0.0.1:48180}
habits.weight.url=${WEIGHT_URL:http://127.0.0.1:48173}
habits.weight.token=${WEIGHT_APP_TOKEN:}

# Wie weit eine Straehne hoechstens zurueckgerechnet wird. Kein fachlicher
# Wert, sondern ein Deckel gegen endloses Nachfragen bei den Quellen.
habits.max-lookback-days=730
