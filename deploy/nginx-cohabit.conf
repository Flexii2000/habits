      # coHabit - Weboberflaeche und API unter fherrmann.com/cohabit/, bedient vom
      # Dienst habits (:48190). Eingesetzt von deploy/setup-cohabit.sh direkt vor dem
      # /grades/-Block.
      #
      # KEIN Privat-Gate: Torben und alle Eingeladenen haben kein fh_private. Der
      # Dienst prueft jeden Zugang selbst (Bearer, fh_private, cohabit_token,
      # health_token) und antwortet ohne gueltigen mit 401 - nur Weboberflaeche,
      # Einladungs-Vorschau und /cohabit/setup sind offen.
      #
      # proxy_pass ohne Pfad: die Adresse kommt samt /cohabit/ beim Dienst an, der
      # genau dort seine Seite und API hat. 12 MB fuer Fotos (der Dienst nimmt 10).
      location = /cohabit {
          return 301 /cohabit/;
      }
      location /cohabit/ {
          proxy_pass http://127.0.0.1:48190;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
          client_max_body_size 12m;
          proxy_read_timeout 60s;
      }

